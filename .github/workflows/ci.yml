name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: foundation-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Locked static, unit and contract gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: uv_version
        name: Read pinned uv version
        shell: bash
        run: |
          set -euo pipefail
          version="$(<.uv-version)"
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: ${{ steps.uv_version.outputs.version }}
          enable-cache: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: "11.13.0"
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install locked Python workspace
        run: uv sync --locked --all-groups --all-packages
      - name: Install locked frontend workspace
        run: pnpm install --frozen-lockfile
      - name: Repository contracts and generated-artifact drift
        run: uv run python -m tools.check --scope ci
      - name: Python lint and typing
        run: |
          uv run ruff check apps/api/src migrations tests tools
          uv run pyright apps/api/src tests/integration
      - name: Python tests
        run: uv run pytest -q
      - name: Shipped documentation build
        run: uv run mkdocs build --strict --config-file mkdocs.yml
      - name: Frontend static, unit and production build
        run: pnpm check

  runtime:
    name: Disposable Compose and browser proof
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build lean images and prove disposable runtime
        env:
          CUSTOMETRY_RUN_BROWSER: "1"
        run: ./deploy/compose/ci-smoke.sh
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-playwright-evidence
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  foundation-gate:
    name: Foundation gate
    if: always()
    needs: [quality, runtime]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Foundation job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUNTIME_RESULT: ${{ needs.runtime.result }}
        run: |
          test "${QUALITY_RESULT}" = success
          test "${RUNTIME_RESULT}" = success
