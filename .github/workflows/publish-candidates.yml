name: Publish immutable Foundation candidates

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-candidates-${{ github.sha }}
  cancel-in-progress: false

jobs:
  foundation:
    name: Required Foundation gate
    uses: ./.github/workflows/ci.yml

  candidate_metadata:
    name: Derive trusted candidate metadata
    needs: foundation
    runs-on: ubuntu-24.04
    outputs:
      api_image: ${{ steps.metadata.outputs.api_image }}
      version: ${{ steps.metadata.outputs.version }}
      web_image: ${{ steps.metadata.outputs.web_image }}
    steps:
      - id: metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
            echo "Candidate publication is restricted to protected main." >&2
            exit 1
          }
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          short_sha="${GITHUB_SHA:0:12}"
          {
            echo "api_image=ghcr.io/${owner}/custometry-api"
            echo "version=0.1.0-dev.0+sha.${short_sha}"
            echo "web_image=ghcr.io/${owner}/custometry-web"
          } >>"${GITHUB_OUTPUT}"

  api_image:
    name: Publish immutable API candidate
    needs: candidate_metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.candidate_metadata.outputs.api_image }}:sha-${{ github.sha }}
          build-args: CUSTOMETRY_VERSION=${{ needs.candidate_metadata.outputs.version }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: mode=max
          sbom: true

  web_image:
    name: Publish immutable Web candidate
    needs: candidate_metadata
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.candidate_metadata.outputs.web_image }}:sha-${{ github.sha }}
          build-args: CUSTOMETRY_VERSION=${{ needs.candidate_metadata.outputs.version }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          provenance: mode=max
          sbom: true

  record_candidate:
    name: Record immutable candidate digests
    needs: [candidate_metadata, api_image, web_image]
    runs-on: ubuntu-24.04
    steps:
      - shell: bash
        env:
          API_DIGEST: ${{ needs.api_image.outputs.digest }}
          API_IMAGE: ${{ needs.candidate_metadata.outputs.api_image }}
          VERSION: ${{ needs.candidate_metadata.outputs.version }}
          WEB_DIGEST: ${{ needs.web_image.outputs.digest }}
          WEB_IMAGE: ${{ needs.candidate_metadata.outputs.web_image }}
        run: |
          set -euo pipefail
          digest_pattern='^sha256:[0-9a-f]{64}$'
          [[ "${API_DIGEST}" =~ ${digest_pattern} ]]
          [[ "${WEB_DIGEST}" =~ ${digest_pattern} ]]
          {
            echo "## Foundation candidate"
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Version: \`${VERSION}\`"
            echo "- API: \`${API_IMAGE}@${API_DIGEST}\`"
            echo "- Web: \`${WEB_IMAGE}@${WEB_DIGEST}\`"
            echo
            echo "This is a main-branch candidate, not an accepted end-user release."
          } >>"${GITHUB_STEP_SUMMARY}"
