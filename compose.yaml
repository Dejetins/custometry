name: ${COMPOSE_PROJECT_NAME:?Run deploy/compose/bootstrap.sh so the lifecycle has an explicit project name}

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  control-db:
    <<: *service-defaults
    image: postgres:17.5-alpine3.21@sha256:5d004e058f520673f1f6edbad6b1603d5dab4c818e257c041889ef64672a8cc4
    environment:
      POSTGRES_DB: custometry
      POSTGRES_USER: custometry
      POSTGRES_PASSWORD_FILE: /run/secrets/control_db_password
    secrets:
      - control_db_password
    volumes:
      - control_db_data:/var/lib/postgresql/data
    networks:
      - control
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U custometry -d custometry"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 8s
    mem_limit: 1g
    cpus: 1.5

  demo-source-db:
    <<: *service-defaults
    profiles: ["demo"]
    image: postgres:17.5-alpine3.21@sha256:5d004e058f520673f1f6edbad6b1603d5dab4c818e257c041889ef64672a8cc4
    environment:
      POSTGRES_DB: northwind_retail
      POSTGRES_USER: demo_source_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/demo_source_admin_password
      CUSTOMETRY_DATA_PROFILE: ${CUSTOMETRY_DATA_PROFILE:-demo}
      CUSTOMETRY_ALLOW_BENCHMARK: ${CUSTOMETRY_ALLOW_BENCHMARK:-0}
    secrets:
      - demo_source_admin_password
      - demo_source_reader_password
    volumes:
      - demo_source_data:/var/lib/postgresql/data
      - ./deploy/demo-source/init:/docker-entrypoint-initdb.d:ro
    networks:
      - demo_source
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_source_admin -d northwind_retail"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 8s
    mem_limit: 1g
    cpus: 1.5

  migrate:
    profiles: ["migration"]
    image: ${CUSTOMETRY_API_IMAGE:-custometry-api:dev}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        CUSTOMETRY_VERSION: ${CUSTOMETRY_VERSION:-0.1.0-dev.0}
    command: ["alembic", "-c", "/app/migrations/alembic.ini", "upgrade", "head"]
    environment: &api-environment
      CUSTOMETRY_VERSION: ${CUSTOMETRY_VERSION:-0.1.0-dev.0}
      CUSTOMETRY_ENVIRONMENT: ${CUSTOMETRY_ENVIRONMENT:-development}
      CUSTOMETRY_DATABASE_HOST: control-db
      CUSTOMETRY_DATABASE_PORT: "5432"
      CUSTOMETRY_DATABASE_NAME: custometry
      CUSTOMETRY_DATABASE_USER: custometry
      CUSTOMETRY_DATABASE_PASSWORD_FILE: /run/secrets/control_db_password
    secrets:
      - control_db_password
    networks:
      - control
    depends_on:
      control-db:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5

  api:
    <<: *service-defaults
    image: ${CUSTOMETRY_API_IMAGE:-custometry-api:dev}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        CUSTOMETRY_VERSION: ${CUSTOMETRY_VERSION:-0.1.0-dev.0}
    environment: *api-environment
    secrets:
      - control_db_password
    networks:
      - web_to_api
      - control
    depends_on:
      control-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    mem_limit: 512m
    cpus: 1.0

  web:
    <<: *service-defaults
    image: ${CUSTOMETRY_WEB_IMAGE:-custometry-web:dev}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        CUSTOMETRY_VERSION: ${CUSTOMETRY_VERSION:-0.1.0-dev.0}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - edge_to_web
      - web_to_api
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    mem_limit: 128m
    cpus: 0.5

  edge:
    <<: *service-defaults
    image: ${CUSTOMETRY_WEB_IMAGE:-custometry-web:dev}
    command: ["nginx", "-c", "/etc/nginx/edge.conf", "-g", "daemon off;"]
    depends_on:
      web:
        condition: service_healthy
    networks:
      - ingress_edge
      - edge_to_web
    ports:
      - name: http
        target: 8080
        host_ip: ${CUSTOMETRY_BIND_HOST:-127.0.0.1}
        published: "${CUSTOMETRY_HTTP_PORT:-0}"
        protocol: tcp
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    mem_limit: 64m
    cpus: 0.25

volumes:
  control_db_data: {}
  demo_source_data: {}

secrets:
  control_db_password:
    file: ${CUSTOMETRY_SECRETS_DIR:-./deploy/compose/.runtime-secrets}/control_db_password
  demo_source_admin_password:
    file: ${CUSTOMETRY_SECRETS_DIR:-./deploy/compose/.runtime-secrets}/demo_source_admin_password
  demo_source_reader_password:
    file: ${CUSTOMETRY_SECRETS_DIR:-./deploy/compose/.runtime-secrets}/demo_source_reader_password

networks:
  ingress_edge:
    internal: false
  edge_to_web:
    internal: true
  web_to_api:
    internal: true
  control:
    internal: true
  demo_source:
    internal: true
