[project]
name = "custometry"
version = "0.1.0.dev0"
description = "Self-hosted customer analytics and forecasting platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
custometry-check = "tools.check:cli"
generate_requirement_index = "tools.custometry_quality.generate_requirement_index:cli"
generate_program_requirement_matrix = "tools.custometry_quality.generate_program_requirement_matrix:cli"
validate_blueprints = "tools.custometry_quality.validate_blueprints:cli"
generate_docs_index = "tools.custometry_quality.generate_docs_index:cli"
check_docs_links = "tools.custometry_quality.check_docs_links:cli"
validate_repository_layout = "tools.custometry_quality.validate_repository_layout:cli"
validate_staged_workstream = "tools.custometry_quality.validate_staged_workstream:cli"
validate_agent_profiles = "tools.custometry_quality.validate_agent_profiles:cli"
doctor = "tools.custometry_quality.doctor:cli"
safe_cleanup = "tools.custometry_quality.cleanup:cli"
custometry-generate-requirement-index = "tools.custometry_quality.generate_requirement_index:cli"
custometry-generate-program-requirement-matrix = "tools.custometry_quality.generate_program_requirement_matrix:cli"
custometry-validate-blueprints = "tools.custometry_quality.validate_blueprints:cli"
custometry-generate-docs-index = "tools.custometry_quality.generate_docs_index:cli"
custometry-check-docs-links = "tools.custometry_quality.check_docs_links:cli"
custometry-validate-repository-layout = "tools.custometry_quality.validate_repository_layout:cli"
custometry-validate-staged-workstream = "tools.custometry_quality.validate_staged_workstream:cli"
custometry-validate-agent-profiles = "tools.custometry_quality.validate_agent_profiles:cli"
custometry-doctor = "tools.custometry_quality.doctor:cli"
custometry-cleanup = "tools.custometry_quality.cleanup:cli"
custometry-check-ddd-boundaries = "tools.custometry_quality.check_ddd_boundaries:cli"
custometry-check-contract-drift = "tools.custometry_quality.check_contract_drift:cli"
custometry-validate-route-registry = "tools.custometry_quality.validate_route_registry:cli"
custometry-check-i18n-parity = "tools.custometry_quality.check_i18n_parity:cli"
custometry-validate-migration-lifecycle = "tools.custometry_quality.validate_migration_lifecycle:cli"
custometry-validate-fixture-manifest = "tools.custometry_quality.validate_fixture_manifest:cli"
custometry-compose-lifecycle = "tools.custometry_quality.compose_lifecycle:cli"
custometry-browser-smoke = "tools.custometry_quality.browser_smoke:cli"
custometry-gate-sbom = "tools.custometry_quality.gate_sbom:cli"
custometry-gate-licenses = "tools.custometry_quality.gate_licenses:cli"
custometry-gate-recovery = "tools.custometry_quality.gate_recovery:cli"
custometry-gate-performance = "tools.custometry_quality.gate_performance:cli"

[dependency-groups]
dev = [
  "pyright>=1.1.400,<2",
  "ruff>=0.12,<1",
]
test = [
  "hypothesis>=6.130,<7",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "testcontainers[postgres]>=4.12,<5",
]
docs = [
  "mkdocs-material>=9.6,<10",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]

[tool.uv]
default-groups = ["dev", "test"]

[tool.uv.workspace]
members = ["apps/api", "docs-site"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["tools", "tests/tooling"]
